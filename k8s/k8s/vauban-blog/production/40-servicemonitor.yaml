# ServiceMonitors removed: neither the Next.js frontend nor bare Redis
# expose Prometheus metrics endpoints. /api/health returns JSON, not
# OpenMetrics format, causing permanent TargetDown alerts.
#
# To re-enable monitoring:
# - Frontend: add a /api/metrics endpoint (e.g. prom-client) and create
#   a ServiceMonitor targeting that path
# - Redis: add a redis-exporter sidecar and create a ServiceMonitor for it
