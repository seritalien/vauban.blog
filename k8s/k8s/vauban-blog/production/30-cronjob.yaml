apiVersion: batch/v1
kind: CronJob
metadata:
  name: publish-scheduled
  namespace: vauban-blog
  labels:
    app: vauban-blog
    component: scheduler
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: vauban-blog
            component: scheduler
        spec:
          priorityClassName: production
          restartPolicy: OnFailure
          containers:
            - name: publish-scheduler
              image: curlimages/curl:8.5.0
              command:
                - /bin/sh
                - -c
                - |
                  # Retry with backoff — kube-router needs time to populate
                  # network policy ipsets for short-lived CronJob pods
                  for i in 2 3 5 8 13; do
                    curl \
                      -H "Authorization: Bearer ${CRON_SECRET}" \
                      --fail \
                      --silent \
                      --show-error \
                      --max-time 60 \
                      "http://frontend-active:3000/api/cron/publish-scheduled" && exit 0
                    echo "Attempt failed, retrying in ${i}s..."
                    sleep "$i"
                  done
                  exit 1
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: vauban-blog-secrets
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
